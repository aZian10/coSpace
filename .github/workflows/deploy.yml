name: CI/CD - Test & Deploy to AWS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Lint, Prisma Generate & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run ESLint
        run: npm run lint

      - name: Run test suite
        env:
          JWT_ACCESS_SECRET: ci_test_access_secret_key_for_github_actions_2026
          JWT_REFRESH_SECRET: ci_test_refresh_secret_key_for_github_actions_2026
        run: npm test

  deploy:
    name: Deploy to AWS EC2
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH to Public EC2
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

            cd ~/coSpace
            git fetch origin main
            git reset --hard origin/main

            npm ci --prefer-offline --no-audit
            npx prisma generate
            npx prisma db push
            npm run build
            rm -rf ~/.npm/_cacache/* ~/.npm/_logs/*

            pm2 restart cospace --update-env
            pm2 save

            sleep 3
            curl -fsS http://127.0.0.1:3000 > /dev/null
